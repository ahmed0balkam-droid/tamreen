# يطرق قاعدة البيانات مرة يومياً عشان مشروع Supabase المجاني ما يتوقف بسبب قلة النشاط
name: keepalive
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ vars.API_URL }}" -H 'content-type: application/json' -d '{"fn":"getState","arg":{}}' -o /dev/null -w "%{http_code}\n"
